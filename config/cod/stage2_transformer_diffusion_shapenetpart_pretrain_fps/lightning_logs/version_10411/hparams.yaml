specs:
  CODVaeSpecs:
    checkpoint_allowed_missing_prefixes:
    - autoencoder.decoder.conv_refine.
    checkpoint_path: tmp/cod_vae_m32_weights.pt
    decoder_params:
      keep_ratio: 1.0
      mlp_ratio: 2
      num_init_layers: 1
      num_layers: 12
      num_merged_tokens: 8
      output_patch_size: 8
      output_resolution: 128
      use_conv_refine: true
    embed_dimension: 512
    encoder_params:
      num_blocks: 4
      num_layers_per_block: 3
      num_patches: 512
    latent_decoder_layers: 12
    latent_dimension: 32
    latent_tokens: 32
    strict_checkpoint_loading: true
    triplane_dimension: 32
    uncertainty_mode: disabled
  DataSource: datasets
  Description: Pre-train medium unconditional diffusion on ShapeNetPart chair latents
    from the frozen FPS COD encoder shared by the SDF-head-only and decoder-refined
    ABO VAEs
  SdfModelSpecs:
    feature_dim: 32
    hidden_dim: 512
  TrainSplit: datasets/splits/shapenetpart_CHAIR_train.json
  ValSplit: datasets/splits/shapenetpart_CHAIR_val.json
  conditioning: null
  data_path: config/cod/stage2_transformer_diffusion_shapenetpart_pretrain_fps/modulations
  diffusion_model_specs:
    cond: false
    depth: 8
    dropout: 0.25
    heads: 8
    latent_dimension: 32
    latent_tokens: 32
    mlp_ratio: 4
    width: 256
  diffusion_specs:
    P_mean: -1.2
    P_std: 1.2
    rho: 7.0
    sampling_steps: 40
    sigma_data: 1.0
    sigma_max: 80.0
    sigma_min: 0.002
  early_stopping:
    min_delta: 1.0e-05
    mode: min
    monitor: val/loss
    patience: 80
  gradient_clip_val: 1.0
  latent_stats_path: config/cod/stage2_transformer_diffusion_shapenetpart_pretrain_fps/modulations/latent_stats.npz
  learning_rates:
    diffusion: 1.0e-05
  log_every_n_steps: 20
  log_freq: 50
  lr_scheduler:
    epochs: 600
    min_lr: 1.0e-06
    type: cosine
  modulation_cache_path: config/cod/stage2_transformer_diffusion_shapenetpart_pretrain_fps/modulations
  modulation_ckpt_path: config/cod/stage1_sdf_head_multiray21/best.ckpt
  modulation_variants: 4
  num_epochs: 600
  sample_posterior_latents: true
  training_task: diffusion
  validation_noise_seed: 0
  weight_decay: 0.05
