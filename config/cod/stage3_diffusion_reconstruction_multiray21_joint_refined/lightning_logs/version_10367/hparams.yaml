specs:
  CODVaeSpecs:
    checkpoint_allowed_missing_prefixes:
    - autoencoder.decoder.conv_refine.
    checkpoint_path: tmp/cod_vae_m32_weights.pt
    decoder_params:
      keep_ratio: 1.0
      mlp_ratio: 2
      num_init_layers: 1
      num_layers: 12
      num_merged_tokens: 8
      output_patch_size: 8
      output_resolution: 128
      use_conv_refine: true
    embed_dimension: 512
    encoder_params:
      num_blocks: 4
      num_layers_per_block: 3
      num_patches: 512
    latent_decoder_layers: 12
    latent_dimension: 32
    latent_tokens: 32
    strict_checkpoint_loading: true
    triplane_dimension: 32
    uncertainty_mode: disabled
  DataSource: datasets
  Description: Reconstruction-guided continuation of unconditional diffusion on jointly
    refined multi-ray ABO chair latents
  DeterministicValidationSampling: true
  NearSurfaceRatio: 0.7
  SampPerMesh: 4096
  SdfModelSpecs:
    feature_dim: 32
    hidden_dim: 512
  SurfacePointCount: 2048
  TestSplit: datasets/splits/abo_fullchairs_multiray21_CHAIR_val.json
  TrainSplit: datasets/splits/abo_fullchairs_multiray21_CHAIR_train.json
  ValSplit: datasets/splits/abo_fullchairs_multiray21_CHAIR_val.json
  ValidationSamplingSeed: 0
  checkpoint_monitor: val/sdf_denoised
  conditioning: null
  diffusion_ckpt_path: config/cod/stage2_transformer_diffusion_multiray21_joint_refined/best.ckpt
  diffusion_model_specs:
    cond: false
    depth: 8
    dropout: 0.25
    heads: 8
    latent_dimension: 32
    latent_tokens: 32
    mlp_ratio: 4
    width: 256
  diffusion_specs:
    P_mean: -1.2
    P_std: 1.2
    rho: 7.0
    sampling_steps: 40
    sigma_data: 1.0
    sigma_max: 80.0
    sigma_min: 0.002
  early_stopping:
    min_delta: 0.0001
    mode: min
    monitor: val/sdf_denoised
    patience: 15
  gradient_clip_val: 1.0
  latent_stats_path: config/cod/stage2_transformer_diffusion_multiray21_joint_refined/modulations/latent_stats.npz
  learning_rates:
    diffusion: 5.0e-06
  log_every_n_steps: 20
  log_freq: 100
  loss_weights:
    diffusion: 0.1
    direct: 0.0
    generated: 1.0
    kl: 0.0
  lr_scheduler:
    epochs: 100
    min_lr: 5.0e-07
    type: cosine
  modulation_ckpt_path: config/cod/stage1_abo_joint_refinement_multiray21/best-v2.ckpt
  modulation_path: config/cod/stage2_transformer_diffusion_multiray21_joint_refined/modulations
  num_epochs: 100
  sample_posterior: true
  sdf_loss:
    type: l1
  stage3_mode: diffusion_only
  training_task: combined
  validation_noise_seed: 0
  validation_sample_posterior: false
  weight_decay: 0.01
